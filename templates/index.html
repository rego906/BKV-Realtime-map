<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>BKV realtime</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }
    #controls {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,0.95); padding: 10px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2); font-family: Arial, sans-serif;
    }
    select, button, label { width: 220px; margin: 4px 0; }
    .small { font-size: 12px; color: #666; }
  </style>
</head>
<body>

<div id="controls">
  <div><b>Szűrők</b></div>

  <label>Viszonylat:</label>
  <select id="routeFilter"></select>

  <label>Típus:</label>
  <select id="typeFilter"></select>

  <label>Rendszám:</label>
  <select id="plateFilter"></select>

  <button id="refreshBtn">Frissítés</button>

  <label class="small"><input type="checkbox" id="autoRefresh" checked> Automatikus frissítés (30 mp)</label>
  <label class="small"><input type="checkbox" id="decorFilter"> 🎄 Csak feldíszített járművek</label>

  <div class="small" id="status"></div>
</div>

<div id="map"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // -------- Map --------
  const map = L.map('map').setView([47.4979, 19.0402], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

  // -------- DOM --------
  const routeFilter = document.getElementById("routeFilter");
  const typeFilter  = document.getElementById("typeFilter");
  const plateFilter = document.getElementById("plateFilter");
  const refreshBtn  = document.getElementById("refreshBtn");
  const autoRefresh = document.getElementById("autoRefresh");
  const decorFilter = document.getElementById("decorFilter");
  const statusEl    = document.getElementById("status");

  // -------- State --------
  let allVehicles = [];
  const markerById = new Map(); // id -> marker

  // Ikonok: extension NÉLKÜL, mert a Flask /icons route próbálja .png-vel is
  const ICONS = {
    bus: "/icons/busz.png.png",
    tram: "/icons/villamos.png.png",
    trolley: "/icons/trolibusz.png.png",
    hev: "/icons/hév.png.png",
    train: "/icons/vonat"
  };

  const DECORATED = ["V1347","V1608","V1441","V2038","V3873","V3888","V4012","V4120","V4064","JARMU1","BPI829","T9100"];

  function setStatus(s){ statusEl.textContent = s; }

  function uniqueSorted(arr){ return [...new Set(arr.filter(v => v && v !== "N/A"))].sort(); }

  function fillSelect(sel, arr, keepSelected){
    const prev = sel.value;
    sel.innerHTML = "<option value=''>Összes</option>";
    for(const v of arr){
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    }
    if(keepSelected && [...sel.options].some(o => o.value === prev)) sel.value = prev;
  }

  function detectMode(v){
    const model = (v.vehicle_model || "").toLowerCase();
    const route = (v.route_id || "").toLowerCase();

    if (model.includes("vonat") || model.includes("train") || model.includes("rail")) return "train";
    if (route.startsWith("h")) return "hev";
    if (model.includes("trol") || model.includes("trollino")) return "trolley";

    if (
      model.includes("volvo") ||
      model.includes("mercedes") ||
      model.includes("conecto") ||
      model.includes("autóbusz") ||
      model.includes("busz") ||
      model.includes("bus") ||
      model.includes("midi") ||
      model.includes("urbino") ||
      model.includes("man") ||
      model.includes("vanhool")
    ) return "bus";

    if (
      model.includes("villamos") ||
      model.includes("tram") ||
      model.includes("caf") ||
      model.includes("combino") ||
      model.includes("tatra") ||
      model.includes("tátra") ||
      model.includes("tw 6000") ||
      model.includes("ganz") ||
      model.includes("kcsv7")
    ) return "tram";

    return "train";
  }

  function makeIcon(url){
    return L.icon({ iconUrl: url, iconSize:[32,32], iconAnchor:[16,16] });
  }

  function iconFor(v){
    const mode = detectMode(v);
    const url = ICONS[mode] || ICONS.train;
    return makeIcon(url);
  }

  function popupHtml(v){
    return `
      <b>Viszonylat:</b> ${v.route_id}<br>
      <b>Cél:</b> ${v.destination}<br>
      <b>Rendszám:</b> ${v.license_plate}<br>
      <b>Típus:</b> ${v.vehicle_model}
    `;
  }

  // -------- Fetch (sima LISTA jön /vehicles-ről) --------
  async function fetchVehicles(){
    setStatus("Betöltés…");
    const vehicles = await (await fetch("/vehicles", { cache: "no-store" })).json();

    // Debug: ha Renderen üres lenne, legalább lásd
    const count = Array.isArray(vehicles) ? vehicles.length : 0;
    setStatus(`Járművek: ${count}`);

    if(!Array.isArray(vehicles)) return [];
    return vehicles;
  }

  // -------- Filtering (NO fetch) --------
  function getFiltered(){
    const r = routeFilter.value;
    const t = typeFilter.value;
    const p = plateFilter.value;
    const d = decorFilter.checked;

    return allVehicles.filter(v => {
      if (r && v.route_id !== r) return false;
      if (t && v.vehicle_model !== t) return false;
      if (p && v.license_plate !== p) return false;
      if (d && !DECORATED.includes(v.license_plate)) return false;
      return true;
    });
  }

  // -------- Render markers (villogás nélkül) --------
  function renderMarkers(filtered){
    const keep = new Set();

    for(const v of filtered){
      const lat = v.latitude;
      const lon = v.longitude;

      // biztosan szám kell
      if (typeof lat !== "number" || typeof lon !== "number") continue;
      if (!isFinite(lat) || !isFinite(lon)) continue;

      // stabil azonosító (ha van vehicle_id, az a legjobb)
      const id = v.vehicle_id || `${v.route_id}:${v.license_plate}`;
      keep.add(id);

      const existing = markerById.get(id);

      if(existing){
        existing.setLatLng([lat, lon]);
        // próbálunk ikont frissíteni, ha valami 404, akkor is marad a marker
        try {
          existing.setIcon(iconFor(v));
        } catch {}
        existing.setPopupContent(popupHtml(v));
      } else {
        // Fallback: ha ikon 404, attól még legyen marker:
        // Leaflet akkor is létrehozza, maximum nem tölt be képet.
        const m = L.marker([lat, lon], { icon: iconFor(v) })
          .bindPopup(popupHtml(v))
          .addTo(map);
        markerById.set(id, m);
      }
    }

    // töröljük ami nincs már benne
    for(const [id, m] of markerById.entries()){
      if(!keep.has(id)){
        map.removeLayer(m);
        markerById.delete(id);
      }
    }
  }

  function populateFilters(keep=true){
    fillSelect(routeFilter, uniqueSorted(allVehicles.map(v => v.route_id)), keep);
    fillSelect(typeFilter,  uniqueSorted(allVehicles.map(v => v.vehicle_model)), keep);
    fillSelect(plateFilter, uniqueSorted(allVehicles.map(v => v.license_plate)), keep);
  }

  function applyFiltersOnly(){
    const filtered = getFiltered();
    renderMarkers(filtered);
  }

  // -------- Full refresh (fetch + update filters + render) --------
  async function refreshFromServer(){
    const vehicles = await fetchVehicles();
    allVehicles = vehicles;

    populateFilters(true);
    applyFiltersOnly();

    // ha minden oké, de még sincs marker: írjuk ki mennyi volt szűrés után
    const filteredCount = getFiltered().length;
    setStatus(`Járművek: ${allVehicles.length} | Szűrve: ${filteredCount}`);
  }

  // -------- Events: szűrők NEM fetch-elnek --------
  routeFilter.addEventListener("change", applyFiltersOnly);
  typeFilter.addEventListener("change", applyFiltersOnly);
  plateFilter.addEventListener("change", applyFiltersOnly);
  decorFilter.addEventListener("change", applyFiltersOnly);

  refreshBtn.addEventListener("click", refreshFromServer);

  // start
  refreshFromServer();

  // auto refresh 30 mp
  setInterval(() => {
    if(autoRefresh.checked) refreshFromServer();
  }, 30000);

});
</script>

</body>
</html>
